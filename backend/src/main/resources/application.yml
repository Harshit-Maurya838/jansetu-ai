spring:
  application:
    name: jansetu-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jansetu?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:jansetu}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_uuid_jdbc_type: CHAR   # UUIDs stored as CHAR(36) (client-generated, readable in SQL)
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  mail:                            # used by EmailOtpSender outside the dev profile; leave MAIL_HOST empty to disable
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
  servlet:
    multipart:
      max-file-size: 5MB          # meal photos are compressed on device before upload

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

jansetu:
  jwt:
    secret: ${JWT_SECRET:}                 # base64, >= 256 bits. Required.
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  super-admin:                     # first SUPER_ADMIN, created on startup only if none exists
    name: ${SUPERADMIN_NAME:Super Admin}
    mobile: ${SUPERADMIN_MOBILE:}
    email: ${SUPERADMIN_EMAIL:}
    password: ${SUPERADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
